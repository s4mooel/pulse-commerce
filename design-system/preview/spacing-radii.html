<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; align-items: end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { width: 64px; height: 64px; background: var(--ink-100); border: 1px solid var(--border); }
  .name { font-size: 11px; font-weight: 600; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); }
</style></head>
<body>
<div class="card">
  <div class="item"><div class="box" style="border-radius:3px"></div><span class="name">xs</span><span class="px">3px</span></div>
  <div class="item"><div class="box" style="border-radius:6px"></div><span class="name">sm</span><span class="px">6px</span></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><span class="name">md</span><span class="px">8px</span></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><span class="name">lg</span><span class="px">12px</span></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><span class="name">xl</span><span class="px">16px</span></div>
  <div class="item"><div class="box" style="border-radius:9999px"></div><span class="name">full</span><span class="px">9999px</span></div>
</div>
</body></html>
