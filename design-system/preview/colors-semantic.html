<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pill {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px; border-radius: 10px;
    color: #fff; font-size: 14px; font-weight: 600;
    box-shadow: var(--shadow-xs);
  }
  .dot { width: 10px; height: 10px; border-radius: 9999px; background: rgba(255,255,255,0.95); flex-shrink: 0; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.08); }
  .meta { margin-left: auto; font-family: var(--font-mono); font-size: 11px; opacity: 0.85; font-weight: 500; }
  .success  { background: #059669; }
  .warning  { background: #B45309; }
  .danger   { background: #B91C1C; }
  .info     { background: #1D4ED8; }
</style></head>
<body>
<div class="card">
  <div class="pill success"><span class="dot"></span>Success<span class="meta">#059669</span></div>
  <div class="pill warning"><span class="dot"></span>Warning<span class="meta">#B45309</span></div>
  <div class="pill danger"><span class="dot"></span>Danger<span class="meta">#B91C1C</span></div>
  <div class="pill info"><span class="dot"></span>Info<span class="meta">#1D4ED8</span></div>
</div>
</body></html>
