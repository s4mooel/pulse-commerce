<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; align-items: end; padding: 32px 28px; background: var(--bg-subtle); }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 88px; height: 64px; background: #fff; border-radius: 10px; }
  .name { font-size: 11px; font-weight: 600; }
  .var { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); }
</style></head>
<body>
<div class="card">
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="name">xs</span><span class="var">--shadow-xs</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="name">sm</span><span class="var">--shadow-sm</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="name">md</span><span class="var">--shadow-md</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="name">lg</span><span class="var">--shadow-lg</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="name">xl</span><span class="var">--shadow-xl</span></div>
</div>
</body></html>
