<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
  .card { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .row .specimen { flex: 1; color: var(--fg); font-family: 'Bricolage Grotesque', var(--font-sans); }
  .row .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); white-space: nowrap; }
</style></head>
<body>
<div class="card">
  <div class="row">
    <div class="specimen" style="font-size:64px;line-height:0.95;letter-spacing:-0.04em;font-weight:700;font-variation-settings:'opsz' 96">Move <span style="font-weight:400;font-style:italic;font-variation-settings:'opsz' 96,'wdth' 75">everything</span>.</div>
    <div class="meta">Bricolage · 64/700 · -0.04em</div>
  </div>
  <div class="row">
    <div class="specimen" style="font-size:38px;line-height:1;letter-spacing:-0.03em;font-weight:500;font-variation-settings:'opsz' 60">Commerce, faster.</div>
    <div class="meta">Bricolage · 38/500 · -0.03em</div>
  </div>
</div>
</body></html>
