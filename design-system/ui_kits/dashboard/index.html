<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse Commerce — Dashboard</title>
<link rel="icon" href="../../assets/mark.svg" />
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="dashboard.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body data-screen-label="Dashboard">
<div id="root"></div>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="DataTable.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="OrdersScreen.jsx"></script>
<script type="text/babel" src="OrderDetail.jsx"></script>
<script type="text/babel" src="InventoryScreen.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [active, setActive] = useState('orders');
  const [openOrder, setOpenOrder] = useState(null);

  useEffect(() => { lucide.createIcons(); });

  if (active === 'orders' && openOrder) {
    return (
      <Shell active="orders" onNav={(id) => { setActive(id); setOpenOrder(null); }}
             title={openOrder.id} breadcrumb="Orders">
        <OrderDetail order={openOrder} onBack={() => setOpenOrder(null)} />
      </Shell>
    );
  }

  const titles = { home: 'Home', orders: 'Orders', inventory: 'Inventory', customers: 'Customers', analytics: 'Analytics', discounts: 'Discounts', channels: 'Channels', settings: 'Settings', developers: 'Developers' };
  const actions = active === 'home' ? <><Button icon="download">Export</Button><Button variant="primary" icon="plus">New order</Button></> : null;

  return (
    <Shell active={active} onNav={setActive} title={titles[active]} actions={actions}>
      {active === 'home' && <HomeScreen />}
      {active === 'orders' && <OrdersScreen onOpen={setOpenOrder} />}
      {active === 'inventory' && <InventoryScreen />}
      {!['home','orders','inventory'].includes(active) && (
        <div className="od-card" style={{ textAlign: 'center', padding: 64, color: 'var(--fg-subtle)' }}>
          <Icon name="construction" size={32} />
          <p style={{ marginTop: 12, fontSize: 14 }}>{titles[active]} — kit screen not implemented in this prototype.</p>
        </div>
      )}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
